<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SURAKSHA ID - Secure Government Identity Verification System</title>
  <meta name="description" content="Official Government Identity Verification System for authorized officers, police, airport security, and licensed verification agencies." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsQR Code Image Decoder Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- OpenCV.js Computer Vision & High Performance QR Engine -->
  <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-1/dist/opencv.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Leaflet CSS & JS for Live GPS Interactive Map Widget -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Styling & Animations -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gov: {
              blue: '#0B5ED7',
              darkBlue: '#084298',
              navy: '#052C65',
              lightBlue: '#E7F1FF',
              bg: '#F5F7FA',
              darkBg: '#0F172A',
              cardDark: '#1E293B',
              success: '#28A745',
              warning: '#FFC107',
              danger: '#DC3545',
              saffron: '#FF9933',
              greenIndia: '#138808'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          boxShadow: {
            'gov': '0 4px 20px -2px rgba(11, 94, 215, 0.12), 0 2px 6px -1px rgba(0, 0, 0, 0.06)',
            'gov-lg': '0 10px 30px -4px rgba(11, 94, 215, 0.18), 0 4px 12px -2px rgba(0, 0, 0, 0.08)',
            'alert': '0 0 30px rgba(220, 53, 69, 0.5)',
            'success': '0 0 30px rgba(40, 167, 69, 0.4)'
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .font-display {
      font-family: 'Outfit', sans-serif;
    }

    @keyframes scanBeam {
      0% { top: 4%; opacity: 0.8; }
      50% { top: 92%; opacity: 1; }
      100% { top: 4%; opacity: 0.8; }
    }
    
    .animate-scan {
      animation: scanBeam 2s ease-in-out infinite;
    }

    @keyframes sosPulse {
      0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(220, 53, 69, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
    }

    .animate-sos-pulse {
      animation: sosPulse 1.5s infinite;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #liveGpsMap {
      width: 100%;
      height: 180px;
      border-radius: 1rem;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-gov-bg dark:bg-gov-darkBg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">
  
  <div id="app"></div>

  <!-- Include App JavaScript -->
  <script src="./app.js"></script>
</body>
</html>
