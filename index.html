<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>SURAKSHA ID - Secure Government Identity Verification System</title>
  <meta name="description" content="Official Government Identity Verification System for authorized officers, police, airport security, and licensed verification agencies." />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- jsQR Code Image Decoder Library -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <!-- Tesseract.js v4 OCR Engine (v5 WASM worker fails on static hosting) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.1.1/dist/tesseract.min.js"></script>

  <!-- OpenCV.js Computer Vision & High Performance QR Engine -->
  <script async src="https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-1/dist/opencv.js"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Leaflet CSS & JS for Live GPS Interactive Map Widget -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Styling & Animations -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gov: {
              blue: '#0B5ED7',
              darkBlue: '#084298',
              navy: '#052C65',
              lightBlue: '#E7F1FF',
              bg: '#F5F7FA',
              darkBg: '#0F172A',
              cardDark: '#1E293B',
              success: '#28A745',
              warning: '#FFC107',
              danger: '#DC3545',
              gold: '#D97706'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          boxShadow: {
            'gov': '0 4px 20px -2px rgba(11, 93, 215, 0.15)',
            'gov-lg': '0 10px 30px -5px rgba(5, 44, 101, 0.25)',
            'success': '0 4px 20px -2px rgba(40, 167, 69, 0.25)',
            'alert': '0 4px 20px -2px rgba(220, 53, 69, 0.25)'
          }
        }
      }
    }
  </script>
  
  <style>
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(1000%); }
    }
    .animate-scan {
      animation: scanline 2.5s linear infinite;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .dark .glass-card {
      background: rgba(30, 41, 59, 0.85);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    #liveGpsMap {
      width: 100%;
      height: 180px;
      border-radius: 1rem;
      z-index: 10;
    }
  </style>
</head>
<body class="bg-gov-bg dark:bg-gov-darkBg text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-300">
  
  <div id="app"></div>

  <!-- Include App JavaScript with Cache Buster -->
  <script src="./app.js?v=2.2.0"></script>
</body>
</html>
